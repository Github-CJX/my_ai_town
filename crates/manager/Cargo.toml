[package]
name = "manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "town-manager"
path = "src/main.rs"

[dependencies]
agent = { path = "../agent" }
host = { path = "../host" }
serde.workspace = true
serde_json.workspace = true
rand = "0.8"
sha2 = "0.10"
tungstenite = "0.21"
# 账本落 SQLite：与 agent 的 rusqlite 共用同一个 libsqlite3-sys（同版本才不冲突）
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
